name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ohne `version`: die Fassung steht in package.json unter
      # `packageManager`, und die Aktion bricht ab, wenn beides gesetzt ist.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # Prüfläufe ohne Daten und ohne Netz: Datei-Import (GPX/KML/KMZ/GeoJSON)
      # und die Maße in geo.ts. Laufen bei jedem Anstoß mit, sie dauern
      # Sekunden. Alles, was ein gebautes Regionspaket braucht, steckt im
      # Arbeitsablauf „Offline-Pakete".
      - run: pnpm check
